name = "telegram-e2e-runner-bot"
main = "src/worker.mjs"
compatibility_date = "2026-08-22"

kv_namespaces = [
  { binding = "BOT_STATE_KV", id = "dfd4b24b750a4ad19497a9531f44422c", preview_id = "1624c0302b314c939ccbcf51c49f5efa" }
]

[[workflows]]
name = "telegram-e2e-runner-workflow"
binding = "PANEL_RUN_WORKFLOW"
class_name = "TelegramE2ERunWorkflow"

[browser]
binding = "BROWSER"

[vars]
GITHUB_WORKFLOW_FILE = "telegram-web-e2e.yml"
GITHUB_REF = "main"
DEFAULT_SUITE = "autorun"
GITHUB_OWNER = "pushpull-code"
GITHUB_REPO = "telegram-web-e2e"
MTPROTO_SERVICE_URL = "https://mtproto-service-ten.vercel.app"
MTPROTO_DISCOVERY_MAX_DEPTH = "3"
MTPROTO_DISCOVERY_MAX_NODES = "40"
MTPROTO_DISCOVERY_DEV_MAX_DEPTH = "4"
MTPROTO_DISCOVERY_DEV_MAX_NODES = "60"
MTPROTO_DISCOVERY_CLICK_TIMEOUT_MS = "3500"
BROWSER_RUN_MAX_WEBAPP_HANDOFFS = "8"
BROWSER_RUN_CAPTURE_SCREENSHOTS = "1"
MTPROTO_DISCOVERY_CLICK_WEBAPP_HANDOFFS = "1"
MTPROTO_DEVICE_PREFLIGHT = "1"
MTPROTO_DEVICE_PREFLIGHT_BOTS = "artp345_bot"
MTPROTO_DEVICE_COUNTRY_LOOKUP_URLS = "https://ipapi.co/json/,https://ipwho.is/"
AI_BASE_URL = "https://api.deepseek.com"
AI_MODEL = "deepseek-v4-flash"
AI_MAX_TOKENS = "8000"
