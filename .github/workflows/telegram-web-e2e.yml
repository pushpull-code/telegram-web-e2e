name: Telegram Web E2E

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Test suite to run (bot | mtproto | discover_mtproto | generated_scenario | generated_scenarios | scenario | discover | autorun | freelancer | settings | all)'
        required: false
        default: 'bot'
      scenario_file:
        description: 'Scenario JSON file for scenario suite'
        required: false
        default: 'scenarios/rate2cash-basic.json'
      generated_scenario_draft:
        description: 'Draft id from generated-scenarios.json for generated_scenario suite'
        required: false
        default: 'start-smoke'
      generated_scenario_allow_test_account:
        description: 'Allow generated drafts marked safety=test-account (true | false)'
        required: false
        default: 'false'
      generated_scenario_drafts:
        description: 'Selector for generated_scenarios suite: safe | all-safe | runnable | comma-separated draft ids'
        required: false
        default: 'safe'
      generated_scenario_max_drafts:
        description: 'Max drafts for generated_scenarios suite'
        required: false
        default: '4'
      chat_id:
        description: 'Telegram chat id for Cloudflare report callback (optional)'
        required: false
        default: ''
      lang:
        description: 'Report language (ru | en)'
        required: false
        default: 'ru'
      bot_lang:
        description: 'Bot interface language for autorun (ru | en)'
        required: false
        default: 'ru'
      scenario_key:
        description: 'Scenario key for report'
        required: false
        default: 'start_finish'
      report_callback_url:
        description: 'Override Cloudflare report callback URL (optional)'
        required: false
        default: ''
  schedule:
    - cron: "0 5 * * *"

concurrency:
  group: telegram-web-e2e
  cancel-in-progress: false

jobs:
  run-tests:
    name: Run Playwright Bot E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      BOT_USERNAME: ${{ vars.BOT_USERNAME }}
      TELEGRAM_WEB_URL: ${{ vars.TELEGRAM_WEB_URL }}
      TELEGRAM_STORAGE_STATE_B64: ${{ secrets.TELEGRAM_STORAGE_STATE_B64 }}
      RUN_CHAT_ID: ${{ inputs.chat_id }}
      RUN_LANG: ${{ inputs.lang }}
      RUN_SCENARIO_KEY: ${{ inputs.scenario_key }}
      SCENARIO_FILE: ${{ inputs.scenario_file }}
      GENERATED_SCENARIO_DRAFT: ${{ inputs.generated_scenario_draft }}
      GENERATED_SCENARIO_DRAFTS: ${{ inputs.generated_scenario_drafts }}
      GENERATED_SCENARIO_ALLOW_TEST_ACCOUNT: ${{ inputs.generated_scenario_allow_test_account }}
      GENERATED_SCENARIO_MAX_DRAFTS: ${{ inputs.generated_scenario_max_drafts }}
      RUN_REPORT_CALLBACK_URL: ${{ inputs.report_callback_url }}
      MTPROTO_SERVICE_URL: ${{ vars.MTPROTO_SERVICE_URL }}
      MTPROTO_SERVICE_TOKEN: ${{ secrets.MTPROTO_SERVICE_TOKEN }}
      MTPROTO_DISCOVERY_MAX_DEPTH: ${{ vars.MTPROTO_DISCOVERY_MAX_DEPTH || '1' }}
      MTPROTO_DISCOVERY_MAX_NODES: ${{ vars.MTPROTO_DISCOVERY_MAX_NODES || '8' }}
      MTPROTO_DISCOVERY_CLICK_TIMEOUT_MS: ${{ vars.MTPROTO_DISCOVERY_CLICK_TIMEOUT_MS || '3500' }}
      MTPROTO_DISCOVERY_WEB_TARGETS: ${{ vars.MTPROTO_DISCOVERY_WEB_TARGETS || '1' }}
      MTPROTO_DISCOVERY_MAX_URL_AUDITS: ${{ vars.MTPROTO_DISCOVERY_MAX_URL_AUDITS || '5' }}
      MTPROTO_DISCOVERY_WEB_TARGET_TIMEOUT_MS: ${{ vars.MTPROTO_DISCOVERY_WEB_TARGET_TIMEOUT_MS || '20000' }}
      MTPROTO_DISCOVERY_WEB_SAFE_CLICKS: ${{ vars.MTPROTO_DISCOVERY_WEB_SAFE_CLICKS || '0' }}
      MTPROTO_DISCOVERY_MAX_WEB_SAFE_CLICKS: ${{ vars.MTPROTO_DISCOVERY_MAX_WEB_SAFE_CLICKS || '2' }}
      MTPROTO_DISCOVERY_WEB_UNSAFE_INTERACTION_RE: ${{ vars.MTPROTO_DISCOVERY_WEB_UNSAFE_INTERACTION_RE }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      AI_BASE_URL: ${{ vars.AI_BASE_URL }}
      AI_MODEL: ${{ vars.AI_MODEL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      SCREENSHOTS_FILE: .cloudflare-report-screenshots.json
      FAILURE_FILE: .cloudflare-report-failure.json

    steps:
      - name: Mark run start timestamp
        id: started
        shell: bash
        run: |
          echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Install Linux clipboard tools (autorun suite)
        if: ${{ inputs.suite == 'autorun' || inputs.suite == 'all' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y xclip

      - name: Restore Telegram auth storage state
        if: ${{ inputs.suite != 'mtproto' && inputs.suite != 'discover_mtproto' }}
        shell: bash
        run: |
          if [ -z "${TELEGRAM_STORAGE_STATE_B64:-}" ]; then
            echo "::error::Missing secret TELEGRAM_STORAGE_STATE_B64. Generate it from playwright/.auth/user.json and add to repository secrets."
            exit 1
          fi

          mkdir -p playwright/.auth
          printf '%s' "$TELEGRAM_STORAGE_STATE_B64" | base64 --decode > playwright/.auth/user.json

          node -e "JSON.parse(require('fs').readFileSync('playwright/.auth/user.json', 'utf8')); console.log('Auth state restored');"

      - name: Run bot tests
        if: ${{ !inputs.suite || inputs.suite == 'bot' || inputs.suite == 'all' }}
        run: npm run test:bot

      - name: Run MTProto smoke tests
        if: ${{ inputs.suite == 'mtproto' || inputs.suite == 'all' }}
        run: npm run test:mtproto

      - name: Run MTProto discovery with branch analysis
        if: ${{ inputs.suite == 'discover_mtproto' || inputs.suite == 'generated_scenario' || inputs.suite == 'generated_scenarios' || inputs.suite == 'all' }}
        run: npm run test:discover:mtproto

      - name: Extract generated scenario draft
        if: ${{ inputs.suite == 'generated_scenario' }}
        shell: bash
        run: |
          generated_file="$(find test-results -path '*/mtproto-discovery/generated-scenarios.json' -print -quit)"
          if [ -z "${generated_file}" ]; then
            echo "::error::generated-scenarios.json was not found under test-results/"
            exit 1
          fi

          node scripts/extract_generated_scenario.mjs \
            "${generated_file}" \
            "${GENERATED_SCENARIO_DRAFT}" \
            ".generated-scenario.json"

          mkdir -p generated-scenario-source
          cp "${generated_file}" generated-scenario-source/generated-scenarios.json
          for artifact in bot-map.json bot-map.enriched.json generated-test-plan.json telegram-summary.txt qa-report.md web-target-audits.json; do
            source_file="$(dirname "${generated_file}")/${artifact}"
            if [ -f "${source_file}" ]; then
              cp "${source_file}" "generated-scenario-source/${artifact}"
            fi
          done
          cp ".generated-scenario.json" generated-scenario-source/scenario.json

          echo "SCENARIO_FILE=.generated-scenario.json" >> "${GITHUB_ENV}"

      - name: Extract generated scenario suite
        if: ${{ inputs.suite == 'generated_scenarios' }}
        shell: bash
        run: |
          generated_file="$(find test-results -path '*/mtproto-discovery/generated-scenarios.json' -print -quit)"
          if [ -z "${generated_file}" ]; then
            echo "::error::generated-scenarios.json was not found under test-results/"
            exit 1
          fi

          node scripts/extract_generated_scenario_suite.mjs \
            "${generated_file}" \
            "${GENERATED_SCENARIO_DRAFTS}" \
            ".generated-scenario-suite.json"

          mkdir -p generated-scenario-source
          cp "${generated_file}" generated-scenario-source/generated-scenarios.json
          for artifact in bot-map.json bot-map.enriched.json generated-test-plan.json telegram-summary.txt qa-report.md web-target-audits.json; do
            source_file="$(dirname "${generated_file}")/${artifact}"
            if [ -f "${source_file}" ]; then
              cp "${source_file}" "generated-scenario-source/${artifact}"
            fi
          done
          cp ".generated-scenario-suite.json" generated-scenario-source/scenario-suite.json

      - name: Run scenario tests
        if: ${{ inputs.suite == 'scenario' || inputs.suite == 'generated_scenario' || inputs.suite == 'all' }}
        run: npm run test:scenario

      - name: Run generated scenario suite
        if: ${{ inputs.suite == 'generated_scenarios' }}
        run: npm run test:generated-scenarios

      - name: Build generated scenario suite report
        if: ${{ always() && inputs.suite == 'generated_scenarios' }}
        shell: bash
        run: |
          if [ ! -f ".generated-scenario-suite.json" ]; then
            echo "No generated scenario suite manifest found; skipping suite report."
            exit 0
          fi

          mkdir -p generated-scenario-source
          npm run scenario:report-generated-suite -- \
            ".generated-scenario-suite.json" \
            "test-results" \
            "generated-scenario-source/generated-scenario-suite-report.md"

      - name: Run discovery tests
        if: ${{ inputs.suite == 'discover' || inputs.suite == 'all' }}
        run: npm run test:discover

      - name: Run strict autorun bot test
        id: autorun
        if: ${{ inputs.suite == 'autorun' || inputs.suite == 'all' }}
        shell: bash
        env:
          E2E_APP_SCREENSHOT_PATH: tests/fixtures/Screenshot_1.png
          E2E_BOT_LANG: ${{ inputs.bot_lang }}
          E2E_FORCE_CLEAN_START: "1"
        run: |
          set +e
          xvfb-run -a npm run test:autorun:text -- --headed 2>&1 | tee autorun-output.log
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          exit $status

      - name: Run freelancer tests
        if: ${{ inputs.suite == 'freelancer' || inputs.suite == 'all' }}
        run: npm run test:freelancer

      - name: Run settings-flow tests
        if: ${{ inputs.suite == 'settings' || inputs.suite == 'all' }}
        run: npm run test:settings

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: |
            test-results/
            generated-scenario-source/
            .generated-scenario.json
            .generated-scenario-suite.json
          retention-days: 14

      - name: Calculate run duration
        if: always()
        id: duration
        shell: bash
        run: |
          now="$(date +%s)"
          started="${{ steps.started.outputs.epoch }}"
          if [ -z "$started" ]; then
            started="$now"
          fi
          echo "seconds=$((now - started))" >> "$GITHUB_OUTPUT"

      - name: Extract failure reason for Cloudflare report
        if: always()
        env:
          RUN_STATUS: ${{ job.status }}
        run: node scripts/extract_report_failure_reason.mjs autorun-output.log "${FAILURE_FILE}"

      - name: Collect screenshots for Cloudflare report
        if: always()
        run: node scripts/collect_report_screenshots.mjs "${SCREENSHOTS_FILE}"

      - name: Send Cloudflare report callback
        if: ${{ always() && env.RUN_CHAT_ID != '' }}
        env:
          CALLBACK_URL: ${{ env.RUN_REPORT_CALLBACK_URL }}
          CALLBACK_URL_FALLBACK: ${{ vars.CLOUDFLARE_REPORT_URL }}
          CALLBACK_TOKEN: ${{ secrets.CLOUDFLARE_REPORT_TOKEN }}
          CHAT_ID: ${{ env.RUN_CHAT_ID }}
          RUN_LANG: ${{ env.RUN_LANG }}
          RUN_SCENARIO_KEY: ${{ env.RUN_SCENARIO_KEY }}
          RUN_STATUS: ${{ job.status }}
          RUN_DURATION_SEC: ${{ steps.duration.outputs.seconds }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SCREENSHOTS_FILE: ${{ env.SCREENSHOTS_FILE }}
          FAILURE_FILE: ${{ env.FAILURE_FILE }}
        run: node scripts/send_cloudflare_report.mjs
